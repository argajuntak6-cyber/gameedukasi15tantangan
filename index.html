function hud(){const i=idx(S.scr),lv=i>=0&&!C[i].bank;
E('hd').style.display=S.scr=='cover'?'none':'flex';
E('hd').innerHTML='<b>Misi Android Studio</b><span>'+(lv?'Energi: '+'♥'.repeat(Math.max(0,S.lv[i]))+'♡'.repeat(3-Math.max(0,S.lv[i])):'')+'</span><span>Skor: '+total()+'</span><span>Selesai: '+S.done.filter(x=>x).length+'/'+N+'</span><button id="mt">'+(mute?'Suara mati':'Suara aktif')+'</button><button id="mu">Menu</button>';
E('mt').onclick=()=>{mute=!mute;hud()};E('mu').onclick=()=>go('menu')}
function nav(){const s=S.scr,i=idx(s),all=S.done.every(x=>x),z=S.done.indexOf(0);
const pv={guide:'cover',menu:'guide',result:'menu',credit:'result'}[s]||(i>=0?'menu':null);
let nx={cover:'guide',guide:'menu',menu:all?'result':'c'+(z+1),result:'credit'}[s],ok=s!='credit',lb=s=='cover'?'Mulai':'Berikutnya';
if(i>=0){ok=!!S.done[i];nx=i<N-1?'c'+(i+2):(all?'result':'menu');if(i==N-1)lb=all?'Lihat hasil':'Ke menu'}
const mid=i>=0?'Tantangan '+(i+1)+' dari '+N:({guide:'Panduan',menu:'Menu tantangan',result:'Evaluasi',credit:'Informasi kreator'}[s]||'');
E('ft').innerHTML='<button id="pv" '+(pv?'':'style="visibility:hidden"')+'>Kembali</button><span>'+mid+'</span><button class="pri" id="nx" '+(ok?'':'disabled')+'>'+lb+'</button>';
if(pv)E('pv').onclick=()=>go(pv);E('nx').onclick=()=>nx&&go(nx)}
function draw(s){const i=idx(s);if(i>=0)CH[C[i].type](i);else R[s]()}
function go(s){stopT();S.scr=s;E('mn').scrollTop=0;draw(s);hud();nav()}
const head=i=>'<h2>Tantangan '+(i+1)+': '+C[i].t+'</h2>';
function doneCard(i){E('mn').innerHTML=head(i)+'<div class="card"><p>Tantangan ini sudah selesai dengan skor <b>'+S.sc[i]+'</b>. Untuk mencobanya lagi, buka Menu lalu pilih Main lagi.</p></div>'}

/* ---------- layar umum ---------- */
const R={
cover(){E('mn').innerHTML='<div class="row" style="height:100%;align-items:center"><div class="col" style="flex:1.3;gap:6px"><h1>Misi Android Studio</h1><h2 style="color:#F2B84B;font-size:38px">Bangun Aplikasi Pertamamu</h2><p>Studio Kodeku menerima proyek aplikasi kasir untuk koperasi sekolah. Jadilah developer junior: selesaikan 15 tantangan, dari mengenal alat kerja, merancang layar, menghubungkan kode, membereskan bug, sampai siap rilis!</p></div><svg viewBox="0 0 300 440" width="270" height="396" role="img" aria-label="Ilustrasi ponsel Android dengan kode"><rect x="20" y="10" width="260" height="420" rx="36" fill="#1c3a54" stroke="#F2B84B" stroke-width="5"/><rect x="40" y="50" width="220" height="340" rx="14" fill="#0b1620"/><circle cx="150" cy="130" r="44" fill="#1F7A52"/><rect x="60" y="210" width="130" height="14" rx="7" fill="#F2B84B"/><rect x="60" y="240" width="180" height="14" rx="7" fill="#8fb0cc"/><rect x="60" y="270" width="100" height="14" rx="7" fill="#8fb0cc"/><rect x="60" y="320" width="180" height="38" rx="10" fill="#F2B84B"/></svg></div>'},
guide(){E('mn').innerHTML='<h2>Panduan</h2><div class="row"><div class="card col" style="gap:4px"><h2 style="font-size:26px">Tujuan belajar</h2><ul style="font-size:19px"><li>Mengenali ruang kerja, struktur proyek, dan pengaturan Gradle.</li><li>Menyusun langkah membuat proyek dan siklus hidup Activity.</li><li>Merancang layar dan memilih layout yang tepat.</li><li>Menghubungkan kode, Intent, dan komponen tampilan.</li><li>Menemukan dan memperbaiki bug lewat Logcat.</li><li>Menyiapkan aplikasi untuk rilis.</li></ul></div><div class="card col" style="gap:4px"><h2 style="font-size:26px">Aturan main</h2><ul style="font-size:19px"><li>Ada 15 tantangan. Tiap tantangan punya 3 energi, kecuali Demo ke Klien.</li><li>Jawaban benar memberi +100 skor. Jawaban salah mengurangi 1 energi.</li><li>Pada soal pilihan ganda, jawaban benar setelah salah bernilai +50.</li><li>Tantangan 5 punya waktu bonus, jadi ambil keputusan dengan cepat dan tepat.</li><li>Pilih tantangan bebas lewat Menu. Tombol Berikutnya aktif setelah tantangan selesai.</li></ul></div></div><p style="margin-top:12px;font-size:20px">Mentor Bina menemanimu di studio. Kamu berlatih mengambil keputusan, memecahkan masalah, dan mengatur waktu seperti developer sungguhan.</p>'},
menu(){E('mn').innerHTML='<h2 style="font-size:26px;margin-bottom:6px">Menu tantangan</h2><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">'+C.map((c,i)=>'<div class="card col" style="gap:3px;padding:10px 14px"><b style="font-size:15px;color:#F2B84B">'+(S.done[i]?'✓ ':'')+'Tantangan '+(i+1)+(S.done[i]?' · skor '+S.sc[i]:'')+'</b><h2 style="font-size:20px;margin:0">'+c.t+'</h2><p style="font-size:15px;margin:0;line-height:1.3">'+c.d+'</p><button class="pri" style="margin-top:auto;min-height:38px;font-size:17px;padding:4px 10px" data-a="g" data-v="c'+(i+1)+'">'+(S.done[i]?'Main lagi':'Mainkan')+'</button></div>').join('')+'</div>'},
result(){const t=total(),tm=C.reduce((a,c,i)=>a+mx(i),0),p=Math.min(1,t/tm),n=p>=.85?3:p>=.6?2:1,L=['Calon developer, ayo coba lagi','Android Developer Junior','Android Developer Handal'][n-1];
const cats=['Mengenali','Menyusun','Menganalisis'].map(k=>{let s=0,m=0;C.forEach((c,i)=>{if(c.k==k){s+=S.sc[i];m+=mx(i)}});return [k,s/m]});
const rt=C.map((c,i)=>S.sc[i]/mx(i)),lo=rt.indexOf(Math.min(...rt));
const sar=rt[lo]>=.95?'Hebat! Semua tantangan nyaris sempurna.':'Saran: ulangi tantangan "'+C[lo].t+'".';
E('mn').innerHTML='<div class="row"><div class="card col" style="align-items:center;text-align:center;justify-content:center;gap:6px;flex:.8"><div style="font-size:56px;color:#F2B84B" aria-label="'+n+' bintang">'+'★'.repeat(n)+'☆'.repeat(3-n)+'</div><h2 style="margin:0">'+L+'</h2><p style="font-size:24px;margin:0">Skor total: <b>'+t+'</b> dari '+tm+'</p>'+cats.map(k=>'<div style="width:100%;text-align:left;font-size:17px">'+k[0]+'<div style="height:12px;background:#0b1620;border-radius:6px"><div style="height:12px;width:'+Math.round(Math.min(1,k[1])*100)+'%;background:#F2B84B;border-radius:6px"></div></div></div>').join('')+'<p style="font-size:18px;margin:4px 0">'+sar+'</p><button class="pri" id="ag">Main lagi</button></div><div class="col" style="flex:1.2"><div class="card"><h2 style="font-size:24px">Ringkasan pencapaian</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 22px;font-size:15px">'+C.map((c,i)=>'<div style="display:flex;justify-content:space-between;border-bottom:1px solid #3d5c78;padding:2px 0"><span>'+(i+1)+'. '+c.t+'</span><b>'+S.sc[i]+'</b></div>').join('')+'</div></div><div class="card"><h2 style="font-size:22px">Refleksi</h2><p style="font-size:19px">Jika klien melapor aplikasi crash, apa yang pertama kali kamu lakukan dan mengapa?</p><textarea style="height:60px" aria-label="Jawaban refleksi"></textarea></div></div></div>';
E('ag').onclick=()=>{S.done.fill(0);S.sc.fill(0);S.lv.fill(3);S.m.fill(null);go('menu')}},
credit(){E('mn').innerHTML='<h2>Informasi kreator</h2><div class="card"><p>Kreator: [isi nama kreator, boleh disertai gelar]</p><p>Organisasi: [isi nama sekolah atau institusi]</p></div><div class="card" style="margin-top:14px"><p style="font-size:20px">Aset: seluruh ilustrasi berupa grafik vektor (SVG) yang dibuat oleh pengembang. Bunyi umpan balik dihasilkan oleh Web Audio API. Tidak ada aset atau tautan eksternal.</p></div>'}
};

/* ---------- mesin tantangan ---------- */
const CH={
match(i){const d=C[i],m=S.m[i]=S.m[i]||{sel:null,ok:[]};let Lf;
 if(d.geo)Lf='<svg viewBox="0 0 560 300" width="600" height="321" role="img" aria-label="Denah jendela Android Studio">'+d.pairs.map((p,j)=>{const g=d.geo[j],o=m.ok.includes(j);return '<g class="reg'+(o?' ok':'')+(m.sel===j?' sel':'')+'" data-a="ms" data-v="'+j+'" tabindex="0" role="button" aria-label="Bagian jendela nomor '+(j+1)+'"><rect x="'+g[0]+'" y="'+g[1]+'" width="'+g[2]+'" height="'+g[3]+'" rx="8"/><text x="'+(g[0]+g[2]/2)+'" y="'+(g[1]+g[3]/2+7)+'" text-anchor="middle" font-size="'+(p[0].length>9?15:20)+'">'+(o?p[0]:'?')+'</text></g>'}).join('')+'</svg>';
 else Lf='<div class="col" style="gap:8px">'+d.pairs.map((p,j)=>{const o=m.ok.includes(j);return '<button data-a="ms" data-v="'+j+'" class="'+(o?'ok':(m.sel===j?'pri':''))+'" '+(o?'disabled':'')+'>'+p[0]+'</button>'}).join('')+'</div>';
 const Rg='<div class="col" style="gap:8px">'+d.perm.map(j=>{const o=m.ok.includes(j);return '<button data-a="md" data-v="'+j+'" class="'+(o?'ok':'')+'" '+(o?'disabled':'')+'>'+d.pairs[j][1]+'</button>'}).join('')+'</div>';
 E('mn').innerHTML=head(i)+'<p>'+d.p+'</p><div class="row">'+Lf+Rg+'</div><div id="fb">'+d.f+'</div>'},
order(i){const d=C[i],m=S.m[i]=S.m[i]||{n:0};
 E('mn').innerHTML=head(i)+'<p>'+d.p+'</p><div class="row"><div class="col" style="gap:8px">'+d.shuf.map(j=>'<button data-a="so" data-v="'+j+'" class="'+(j<m.n?'ok':'')+'" '+(j<m.n?'disabled':'')+'>'+d.steps[j]+'</button>').join('')+'</div><div class="card col" style="gap:0">'+d.steps.map((s,j)=>'<div class="slot">'+(j+1)+'. '+(j<m.n?s:'…')+'</div>').join('')+'</div></div><div id="fb">'+d.first+'</div>'},
drag(i){const d=C[i],m=S.m[i]=S.m[i]||{ok:[],sel:null};
 E('mn').innerHTML=head(i)+'<p>'+d.p+'</p><div class="row"><div class="col" style="max-width:300px;gap:8px">'+d.pal.map(j=>{const o=m.ok.includes(j);return '<button draggable="true" data-a="dc" data-v="'+j+'" class="'+(o?'ok':(m.sel===j?'pri':''))+'" '+(o?'disabled':'')+'>'+d.comps[j]+'</button>'}).join('')+'</div><div class="card" style="flex:1;background:#fff;color:#12263A;display:flex;flex-direction:column;gap:6px;padding:12px 18px">'+d.comps.map((c,j)=>{const o=m.ok.includes(j);return '<div data-a="dt" data-v="'+j+'" tabindex="0" role="button" aria-label="'+d.targets[j]+'" style="border:2px dashed '+(o?'#1F7A52':'#5a7a98')+';border-radius:8px;padding:8px 12px;min-height:56px;cursor:pointer">'+(o?d.pv[j]:'<span style="font-size:18px">'+d.targets[j]+'</span>')+'</div>'}).join('')+'</div></div><div id="fb">Pilih satu komponen dulu.</div>'},
fill(i){const d=C[i],m=S.m[i]=S.m[i]||{n:0};
 const b=j=>'<span style="display:inline-block;min-width:150px;padding:0 8px;border-radius:6px;text-align:center;background:'+(j<m.n?'#1F7A52':(j==m.n?'#F2B84B':'#0b1620'))+';color:'+(j==m.n?'#12263A':'#fff')+';border:1px dashed #8fb0cc">'+(j<m.n?d.ans[j]:'____')+'</span>';
 const code=d.code.map(l=>esc(l).replace(/\{(\d)\}/g,(_,j)=>b(+j))).join('<br>');
 E('mn').innerHTML=head(i)+'<p>'+d.p+'</p><div class="card" style="font-family:Consolas,monospace;font-size:20px;line-height:'+d.lh+'">'+code+'</div>'+(d.note?'<p style="margin-top:10px;font-size:19px">'+d.note+'</p>':'')+'<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">'+d.words.map(w=>'<button style="min-height:44px;font-size:18px" data-a="wf" data-v="'+w+'">'+w+'</button>').join('')+'</div><div id="fb">Pilih kata untuk bagian kosong pertama.</div>'},
quiz(i){const d=C[i];if(S.done[i]){doneCard(i);return}
 const m=S.m[i]=S.m[i]||{q:0,w:0,t:90,iv:null,set:d.bank?pick(d.bank.length,d.pick):null};
 if(d.timer&&!m.iv)m.iv=setInterval(()=>{if(m.t>0)m.t--;const x=E('tm');if(x)x.textContent=m.t},1000);
 const L=d.bank?d.pick:d.cases.length,c=d.bank?d.bank[m.set[m.q]]:d.cases[m.q];
 E('mn').innerHTML=head(i)+'<div style="display:flex;justify-content:space-between;font-size:22px;margin-bottom:8px"><span>'+(d.bank?'Soal ':'Kasus ')+(m.q+1)+' dari '+L+'</span>'+(d.timer?'<span>Sisa waktu bonus: <b id="tm">'+m.t+'</b> detik</span>':'')+'</div><div class="card"><p style="margin:0">'+c.q+'</p></div><div class="col" style="margin-top:12px;gap:8px">'+c.o.map((o,j)=>'<button data-a="qa" data-v="'+j+'">'+o+'</button>').join('')+'</div><div id="fb">Pilih jawaban yang paling tepat.</div>'},
find(i){const d=C[i];if(S.done[i]){doneCard(i);return}
 const m=S.m[i]=S.m[i]||{q:0,w:0},c=d.cases[m.q];
 E('mn').innerHTML=head(i)+'<div style="font-size:22px;margin-bottom:8px">Kasus '+(m.q+1)+' dari '+d.cases.length+'</div><div class="card" style="padding:10px 18px"><p style="margin:0;font-size:20px">'+c.ctx+'</p></div><div class="col" style="margin-top:10px;gap:6px">'+c.lines.map((l,j)=>'<button data-a="fa" data-v="'+j+'" style="white-space:pre;font-family:Consolas,monospace;font-size:19px;min-height:42px">'+esc(l)+'</button>').join('')+'</div><div id="fb">Klik baris yang menjadi penyebab error.</div>'}
};

/* ---------- aksi ---------- */
const A={
g(v){const i=idx(v);if(S.done[i]){S.done[i]=0;S.sc[i]=0;S.lv[i]=3;S.m[i]=null}go(v)},
ms(v){const i=idx(S.scr),m=S.m[i];v=+v;if(m.ok.includes(v))return;m.sel=v;draw(S.scr);fb('Dipilih. Sekarang pilih pasangannya di kanan.')},
md(v){const i=idx(S.scr),d=C[i],m=S.m[i];v=+v;
 if(m.sel===null){fb('Pilih dulu salah satu item di kiri.','bad');return}
 if(v===m.sel){m.ok.push(v);m.sel=null;S.sc[i]+=100;snd(1);draw(S.scr);hud();
  if(m.ok.length==d.pairs.length){S.done[i]=1;nav();fb('Tantangan selesai! '+d.fin+' +100','ok')}else fb('Benar! '+d.pairs[v][0]+': '+d.pairs[v][1]+'. +100','ok')}
 else{lose(i);fb('Belum tepat. Petunjuk: '+d.pairs[m.sel][2],'bad')}},
so(v){const i=idx(S.scr),d=C[i],m=S.m[i];v=+v;
 if(v==m.n){m.n++;S.sc[i]+=100;snd(1);draw(S.scr);hud();
  if(m.n==d.steps.length){S.done[i]=1;nav();fb('Tantangan selesai! '+d.fin+' '+d.ex[v]+' +100','ok')}else fb('Tepat! '+d.ex[v]+' +100','ok')}
 else{lose(i);fb('Belum urutan itu. Tanyakan: apa yang harus siap sebelum langkah ini?','bad')}},
dc(v){const i=idx(S.scr),d=C[i],m=S.m[i];v=+v;if(m.ok.includes(v))return;m.sel=v;draw(S.scr);fb('Komponen '+d.comps[v]+' dipilih. Sekarang pilih tempatnya.')},
dt(v){const i=idx(S.scr),d=C[i],m=S.m[i];v=+v;
 if(m.sel===null){fb('Pilih dulu komponennya.','bad');return}
 if(m.ok.includes(v))return;
 if(v===m.sel){m.ok.push(v);m.sel=null;S.sc[i]+=100;snd(1);draw(S.scr);hud();
  if(m.ok.length==d.comps.length){S.done[i]=1;nav();fb('Tantangan selesai! '+d.fin+' +100','ok')}else fb('Tepat! Komponen itu cocok dengan tempatnya. +100','ok')}
 else{lose(i);fb('Belum cocok. Petunjuk: '+d.hints[v],'bad')}},
wf(v){const i=idx(S.scr),d=C[i],m=S.m[i];if(S.done[i])return;
 if(v==d.ans[m.n]){m.n++;S.sc[i]+=100;snd(1);draw(S.scr);hud();
  if(m.n==d.ans.length){S.done[i]=1;nav();fb('Tantangan selesai! '+d.fin+' +100','ok')}else fb('Tepat! '+d.ex[m.n-1]+' +100','ok')}
 else{lose(i);fb(d.wr,'bad')}},
qa(v){const i=idx(S.scr),d=C[i],m=S.m[i],c=d.bank?d.bank[m.set[m.q]]:d.cases[m.q],bs=document.querySelectorAll('[data-a=qa]'),L=d.bank?d.pick:d.cases.length,last=m.q==L-1;v=+v;
 if(d.bank){bs.forEach((b,j)=>{b.disabled=true;if(j==c.a)b.classList.add('ok');else if(j==v)b.classList.add('bad')});
  const r=v==c.a;if(r)S.sc[i]+=100;snd(r);hud();
  const msg=(r?'Benar! ':'Belum tepat. ')+c.e+(r?' +100':'');
  if(last){S.done[i]=1;nav();fb(msg+' Demo selesai!',r?'ok':'bad')}
  else{fb(msg,r?'ok':'bad');E('mn').insertAdjacentHTML('beforeend','<button class="pri" style="margin-top:10px" data-a="qn">Soal berikutnya</button>')}
  return}
 if(v==c.a){const pts=m.w?50:100;S.sc[i]+=pts;snd(1);bs.forEach((b,j)=>{b.disabled=true;if(j==v)b.classList.add('ok')});
  if(last){stopT();const bn=d.timer?m.t*2:0;S.sc[i]+=bn;S.done[i]=1;nav();fb(c.e+' +'+pts+'. Tantangan selesai!'+(d.timer?' Bonus waktu +'+bn:''),'ok')}
  else{fb(c.e+' +'+pts,'ok');E('mn').insertAdjacentHTML('beforeend','<button class="pri" style="margin-top:10px" data-a="qn">Kasus berikutnya</button>')}
  hud()}
 else{m.w=1;bs[v].disabled=true;bs[v].classList.add('bad');lose(i);fb('Belum tepat. Pikirkan lagi penyebab masalah sebelum bertindak. Coba pilihan lain.','bad')}},
qn(){const i=idx(S.scr),m=S.m[i];m.q++;m.w=0;draw(S.scr)},
fa(v){const i=idx(S.scr),d=C[i],m=S.m[i],c=d.cases[m.q],bs=document.querySelectorAll('[data-a=fa]'),last=m.q==d.cases.length-1;v=+v;
 if(v==c.bad){const pts=m.w?50:100;S.sc[i]+=pts;snd(1);bs.forEach((b,j)=>{b.disabled=true;if(j==v)b.classList.add('ok')});
  if(last){S.done[i]=1;nav();fb(c.e+' +'+pts+'. Tantangan selesai!','ok')}
  else{fb(c.e+' +'+pts,'ok');E('mn').insertAdjacentHTML('beforeend','<button class="pri" style="margin-top:10px" data-a="fn">Kasus berikutnya</button>')}
  hud()}
 else{m.w=1;bs[v].disabled=true;bs[v].classList.add('bad');lose(i);fb('Bukan baris itu. Baca lagi pesan error, lalu cari baris yang menjadi penyebabnya.','bad')}},
fn(){const i=idx(S.scr),m=S.m[i];m.q++;m.w=0;draw(S.scr)}
};
E('mn').onclick=e=>{const t=e.target.closest('[data-a]');if(t&&!t.disabled)A[t.dataset.a](t.dataset.v)};
E('mn').onkeydown=e=>{if(e.key=='Enter'||e.key==' '){const t=e.target.closest('g[data-a],div[role=button][data-a]');if(t){e.preventDefault();A[t.dataset.a](t.dataset.v)}}};
E('mn').addEventListener('dragstart',e=>{const t=e.target.closest('[data-a=dc]');if(t){e.dataTransfer.setData('text/plain',t.dataset.v);const m=S.m[idx(S.scr)];if(m)m.sel=+t.dataset.v}});
E('mn').addEventListener('dragover',e=>{if(e.target.closest('[data-a=dt]'))e.preventDefault()});
E('mn').addEventListener('drop',e=>{const t=e.target.closest('[data-a=dt]');if(t){e.preventDefault();A.dt(t.dataset.v)}});
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);E('stage').style.transform='translate('+(-640*s)+'px,'+(-360*s)+'px) scale('+s+')'}
addEventListener('resize',fit);fit();go('cover');
</script></body></html>
